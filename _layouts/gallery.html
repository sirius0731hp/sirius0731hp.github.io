<!doctype html>
<html lang="{{ site.locale | default: 'en' }}">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    {{ page.title }}{% if site.title %} | {{ site.title }}{% endif %}
  </title>

  <meta
    name="description"
    content="Selected photographs from places I have lived in and travelled through.">

  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}">

  <style>
    /* =========================
       Base
       ========================= */

    html {
      background: #000;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
    }

    body.lightbox-active {
      overflow: hidden;
    }

    button,
    a {
      font: inherit;
    }


    /* =========================
       Header
       ========================= */

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 48px;
    }

    .gallery-header__title {
      margin: 0;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      line-height: 1;
      text-transform: uppercase;
    }

    .gallery-header__back {
      color: #777;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .gallery-header__back:hover,
    .gallery-header__back:focus {
      color: #fff;
    }


    /* =========================
       Main content
       ========================= */

    .gallery-main {
      width: min(1500px, calc(100% - 96px));
      margin: 64px auto 120px;
    }


    /* =========================
       Introduction
       ========================= */

    .gallery-intro {
      margin-bottom: 96px;
    }

    .gallery-intro h1 {
      max-width: 1000px;
      margin: 0 0 24px;
      color: #fff;
      font-size: clamp(3rem, 7vw, 7.5rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.92;
    }

    .gallery-intro p {
      max-width: 500px;
      margin: 0;
      color: #777;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1.7;
    }


    /* =========================
       Photograph grid
       ========================= */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 88px 32px;
    }

    .gallery-item {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: zoom-in;
      appearance: none;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      border-radius: 0;
      background: #111;
      transition: opacity 0.3s ease;
    }

    .gallery-item:hover img,
    .gallery-item:focus-visible img {
      opacity: 0.72;
    }

    .gallery-item:focus-visible {
      outline: 1px solid #fff;
      outline-offset: 6px;
    }

    .gallery-item__caption {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 14px;
      color: #777;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      line-height: 1.4;
      text-transform: uppercase;
    }


    /* =========================
       Lightbox
       ========================= */

    .gallery-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.98);
    
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    
      transition:
        opacity 0.35s ease,
        visibility 0s linear 0.35s;
    }
    
    .gallery-lightbox.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    
      transition-delay: 0s;
    }

    .gallery-lightbox figure {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 88vw;
      max-height: 92vh;
      margin: 0;
    
      opacity: 0;
      transform: translateY(14px) scale(0.96);
    
      transition:
        opacity 0.4s ease,
        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .gallery-lightbox.open figure {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .gallery-lightbox img {
      display: block;
      max-width: 88vw;
      max-height: 82vh;
      border: 0;
      object-fit: contain;
    }

    .gallery-lightbox figcaption {
      min-height: 1em;
      margin-top: 16px;
      color: #777;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      line-height: 1.5;
      text-align: center;
      text-transform: uppercase;
    }


    /* =========================
       Lightbox controls
       ========================= */

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: fixed;
      z-index: 10000;
      padding: 12px;
      border: 0;
      background: transparent;
      color: #666;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      appearance: none;
      transition: color 0.2s ease;
    }

    .lightbox-close:hover,
    .lightbox-prev:hover,
    .lightbox-next:hover,
    .lightbox-close:focus-visible,
    .lightbox-prev:focus-visible,
    .lightbox-next:focus-visible {
      color: #fff;
    }

    .lightbox-close:focus-visible,
    .lightbox-prev:focus-visible,
    .lightbox-next:focus-visible {
      outline: 1px solid #fff;
      outline-offset: 2px;
    }

    .lightbox-close {
      top: 18px;
      right: 24px;
      font-size: 1.6rem;
    }

    .lightbox-prev,
    .lightbox-next {
      top: 50%;
      font-size: 2.2rem;
      transform: translateY(-50%);
    }

    .lightbox-prev {
      left: 20px;
    }

    .lightbox-next {
      right: 20px;
    }


    /* =========================
       Mobile
       ========================= */

    @media (max-width: 700px) {
      .gallery-header {
        padding: 24px 20px;
      }

      .gallery-main {
        width: calc(100% - 32px);
        margin: 42px auto 80px;
      }

      .gallery-intro {
        margin-bottom: 64px;
      }

      .gallery-intro h1 {
        margin-bottom: 18px;
        font-size: clamp(2.8rem, 15vw, 5rem);
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 52px;
      }

      .gallery-lightbox figure,
      .gallery-lightbox img {
        max-width: calc(100vw - 32px);
      }

      .gallery-lightbox img {
        max-height: 76vh;
      }

      .lightbox-close {
        top: 10px;
        right: 10px;
      }

      .lightbox-prev,
      .lightbox-next {
        top: auto;
        bottom: 18px;
        transform: none;
      }

      .lightbox-prev {
        left: 12px;
      }

      .lightbox-next {
        right: 12px;
      }

      .gallery-lightbox figcaption {
        padding: 0 48px;
      }
    }


    /* =========================
       Reduced motion
       ========================= */

    @media (prefers-reduced-motion: reduce) {
      .gallery-item img,
      .gallery-header__back,
      .lightbox-close,
      .lightbox-prev,
      .lightbox-next {
        transition: none;
      }
    }
   /* Remove the theme's orange focus frame */

.gallery-item:focus,
.gallery-item:active {
  outline: none;
  box-shadow: none;
}

.gallery-item:focus-visible {
  outline: 1px solid #fff;
  outline-offset: 6px;
  box-shadow: none;
}

.gallery-header__back:focus {
  outline: none;
  box-shadow: none;
}

.gallery-header__back:focus-visible {
  outline: 1px solid #fff;
  outline-offset: 5px;
}

.lightbox-close:focus,
.lightbox-prev:focus,
.lightbox-next:focus {
  outline: none;
  box-shadow: none;
}

.lightbox-close:focus-visible,
.lightbox-prev:focus-visible,
.lightbox-next:focus-visible {
  outline: 1px solid #fff;
  outline-offset: 2px;
}


/* Gallery-only transition */

body {
  animation: gallery-page-enter 0.55s ease-out both;
}

.gallery-header {
  animation: gallery-content-enter 0.65s 0.08s ease-out both;
}

.gallery-intro,
.gallery-grid {
  animation: gallery-content-enter 0.7s 0.12s ease-out both;
}

body.gallery-leaving {
  animation: gallery-page-leave 0.35s ease-in forwards;
}

@keyframes gallery-page-enter {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes gallery-content-enter {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes gallery-page-leave {
  from {
    opacity: 1;
  }

  to {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  body,
  .gallery-header,
  .gallery-intro,
  .gallery-grid
  body.gallery-leaving {
    animation: none;
  }
}
  </style>
</head>

<body>
  <header class="gallery-header">
    <p class="gallery-header__title">
      Gallery
    </p>

    <a
      class="gallery-header__back"
      href="{{ '/' | relative_url }}">
      Back
    </a>
  </header>

  <main class="gallery-main">
    {{ content }}
  </main>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const backLink = document.querySelector(".gallery-header__back");

    if (!backLink) return;

    backLink.addEventListener("click", function (event) {
      event.preventDefault();

      const destination = backLink.href;

      document.body.classList.add("gallery-leaving");

      window.setTimeout(function () {
        window.location.href = destination;
      }, 350);
    });
  });
</script>
</body>
</html>

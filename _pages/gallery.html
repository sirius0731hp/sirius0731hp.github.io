<!-- Full-screen photograph viewer -->

<div
  class="gallery-lightbox"
  id="gallery-lightbox"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
  aria-label="Photograph viewer">

  <button
    class="lightbox-close"
    type="button"
    aria-label="Close photograph viewer">
    ×
  </button>

  <button
    class="lightbox-prev"
    type="button"
    aria-label="View previous photograph">
    ‹
  </button>

  <figure>
    <img
      id="lightbox-image"
      src=""
      alt="">

    <figcaption id="lightbox-caption"></figcaption>
  </figure>

  <button
    class="lightbox-next"
    type="button"
    aria-label="View next photograph">
    ›
  </button>
</div>


<script>
  document.addEventListener("DOMContentLoaded", function () {
    const galleryItems = Array.from(
      document.querySelectorAll(".gallery-item")
    );

    const lightbox =
      document.getElementById("gallery-lightbox");

    if (!lightbox || !galleryItems.length) return;

    const lightboxImage =
      document.getElementById("lightbox-image");

    const lightboxCaption =
      document.getElementById("lightbox-caption");

    const lightboxFigure =
      lightbox.querySelector("figure");

    const closeButton =
      lightbox.querySelector(".lightbox-close");

    const previousButton =
      lightbox.querySelector(".lightbox-prev");

    const nextButton =
      lightbox.querySelector(".lightbox-next");

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    const changeDelay = reducedMotion ? 0 : 220;
    const closeDelay = reducedMotion ? 0 : 350;

    let currentImageIndex = 0;
    let lastFocusedElement = null;
    let closeTimer = null;
    let changeTimer = null;
    let isChangingImage = false;


    function normalizeIndex(index) {
      return (
        (index + galleryItems.length) %
        galleryItems.length
      );
    }


    function updateImage(index) {
      currentImageIndex = normalizeIndex(index);

      const selectedItem =
        galleryItems[currentImageIndex];

      const selectedThumbnail =
        selectedItem.querySelector("img");

      lightboxImage.src =
        selectedItem.dataset.src;

      lightboxImage.alt =
        selectedThumbnail
          ? selectedThumbnail.alt
          : "";

      lightboxCaption.textContent =
        selectedItem.dataset.caption || "";
    }


    function showImage(index) {
      window.clearTimeout(closeTimer);
      window.clearTimeout(changeTimer);

      isChangingImage = false;
      lightboxFigure.classList.remove("is-changing");

      updateImage(index);

      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.classList.add("lightbox-active");

      closeButton.focus();
    }


    function openLightbox(index) {
      lastFocusedElement = document.activeElement;
      showImage(index);
    }


    function changeImage(index) {
      if (isChangingImage) return;

      isChangingImage = true;

      const nextIndex = normalizeIndex(index);
      const nextItem = galleryItems[nextIndex];

      /*
       * Start loading the next photograph before
       * replacing the current photograph.
       */
      const preloader = new Image();
      preloader.src = nextItem.dataset.src;

      lightboxFigure.classList.add("is-changing");

      window.clearTimeout(changeTimer);

      changeTimer = window.setTimeout(function () {
        updateImage(nextIndex);

        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            lightboxFigure.classList.remove("is-changing");

            window.setTimeout(function () {
              isChangingImage = false;
            }, changeDelay);
          });
        });
      }, changeDelay);
    }


    function closeLightbox() {
      window.clearTimeout(changeTimer);

      isChangingImage = false;
      lightboxFigure.classList.remove("is-changing");

      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.classList.remove("lightbox-active");

      closeTimer = window.setTimeout(function () {
        if (!lightbox.classList.contains("open")) {
          lightboxImage.src = "";
          lightboxImage.alt = "";
          lightboxCaption.textContent = "";
        }
      }, closeDelay);

      if (lastFocusedElement) {
        lastFocusedElement.focus();
      }
    }


    galleryItems.forEach(function (item, index) {
      item.addEventListener("click", function () {
        openLightbox(index);
      });
    });


    closeButton.addEventListener(
      "click",
      closeLightbox
    );


    previousButton.addEventListener(
      "click",
      function () {
        changeImage(currentImageIndex - 1);
      }
    );


    nextButton.addEventListener(
      "click",
      function () {
        changeImage(currentImageIndex + 1);
      }
    );


    lightbox.addEventListener("click", function (event) {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });


    document.addEventListener("keydown", function (event) {
      if (!lightbox.classList.contains("open")) {
        return;
      }

      if (event.key === "Escape") {
        closeLightbox();
      }

      if (event.key === "ArrowLeft") {
        changeImage(currentImageIndex - 1);
      }

      if (event.key === "ArrowRight") {
        changeImage(currentImageIndex + 1);
      }
    });
  });
</script>
